<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Meme Screener{% endblock %}</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#262a33; --text:#e6e8ec; --dim:#8b919c;
          --good:#3ecf8e; --mid:#e5b84b; --bad:#ef5b5b; --accent:#6aa3ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; }
  main { max-width:960px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:22px; margin:0 0 4px; } h2 { font-size:16px; margin:28px 0 10px; color:var(--dim); font-weight:600; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:18px; }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px; }
  .row { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .score { font-size:26px; font-weight:700; min-width:58px; font-variant-numeric:tabular-nums; }
  .s-good { color:var(--good); } .s-mid { color:var(--mid); } .s-bad { color:var(--bad); }
  .name { font-weight:600; } .name small { color:var(--dim); font-weight:400; }
  .stats { color:var(--dim); font-size:13px; font-variant-numeric:tabular-nums; }
  .links { margin-left:auto; font-size:13px; display:flex; gap:12px; }
  .bars { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:6px 14px; margin-top:12px; }
  .bar { font-size:12px; color:var(--dim); }
  .track { height:5px; background:var(--line); border-radius:3px; margin-top:3px; overflow:hidden; }
  .fill { height:100%; background:var(--accent); }
  .warn { margin:10px 0 0; padding:0; list-style:none; font-size:13px; color:var(--mid); }
  .warn li::before { content:"⚠ "; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:500; }
  .fail { color:var(--bad); }
  details summary { cursor:pointer; color:var(--dim); margin:24px 0 10px; }
  .note { color:var(--dim); font-size:12px; margin-top:32px; }
  .delta { font-size:11px; font-weight:500; color:var(--dim); text-align:center; }
  .filters { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; margin:0 0 18px;
             font-size:13px; color:var(--dim); }
  .filters input, .filters select, .filters button { background:var(--card); color:var(--text);
             border:1px solid var(--line); border-radius:6px; padding:5px 7px; font:inherit; }
  .filters input { width:72px; }
  .filters button { cursor:pointer; padding:5px 12px; }
  td button { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:6px;
              padding:3px 8px; font:inherit; font-size:12px; cursor:pointer; }
  .nav { float:right; font-size:14px; }
  .tabs { display:flex; gap:6px; margin:0 0 14px; }
  .tabs a { padding:6px 12px; border:1px solid var(--line); border-radius:8px; color:var(--dim); font-size:14px; }
  .tabs a.on { background:var(--card); color:var(--text); border-color:var(--accent); }
  .tabs a:hover { text-decoration:none; }
</style>
</head>
<body><main>
{% block body %}{% endblock %}
<p class="note">Scores measure safety and market health, not upside. Passing means "worth researching further". Not financial advice.</p>
</main></body>
</html>
