name: meme-screener

on:
  schedule:
    - cron: "23 * * * *"   # hourly: Telegram commands, early tracker, price alerts for your positions.
                           # The daily scan runs inside the first run after 08:00 Cyprus time (scan.py --if-due),
                           # so it still happens when GitHub skips scheduled runs.
  workflow_dispatch:
    inputs:
      scan:
        description: "Also run the full daily scan"
        type: boolean
        default: false

permissions:
  contents: write   # save the database to the "data" branch
  pages: write      # publish the dashboard
  id-token: write

concurrency:
  group: meme-data          # never two runs writing the database at once
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      MEME_DB: data/screener.db
      MEME_PRIVATE_DB: data/private.db
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      POSITIONS_KEY: ${{ secrets.POSITIONS_KEY }}
      MEME_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Load database
        id: load
        run: bash ci/data.sh pull

      - name: Hourly jobs
        continue-on-error: true      # a failed hour must not block the daily scan or saving
        run: python hourly.py

      - name: Daily scan (if due)
        run: |
          if [ "${{ inputs.scan }}" = "true" ]; then python scan.py; else python scan.py --if-due; fi

      - name: Save database
        if: always() && steps.load.outcome == 'success'
        run: bash ci/data.sh push

      - name: Build dashboard
        if: always() && steps.load.outcome == 'success'
        run: python freeze.py site

      - uses: actions/upload-pages-artifact@v3
        if: always() && steps.load.outcome == 'success'
        with:
          path: site

      - id: deploy
        if: always() && steps.load.outcome == 'success'
        uses: actions/deploy-pages@v4
